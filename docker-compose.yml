# Published image:    docker compose pull && docker compose up -d
# Build from source:  docker compose up -d --build
# Before first run, create the data dirs as the user who will own them, or
# Docker creates them root-owned and the container user (UID 1000) can't write:
#   mkdir -p data/config data/db
# The TMDB token can go in data/config/fi_config.json, or be set later in the
# web UI under ☰ → Settings.
services:
  flickimp:
    image: ghcr.io/nutball-labs/flickimp:latest
    build: .
    container_name: flickimp
    restart: unless-stopped
    ports:
      - "8647:8647"
    volumes:
      - ./data/config:/home/appuser/.config/flickimp
      - ./data/db:/home/appuser/.local/share/flickimp/db
      # Development only: serve web/ live from the checkout instead of the image
      # - ./web:/app/web

# SN: 00006
