# Build the FlickImp container image and publish it to the GitHub Container
# Registry (ghcr.io/nutball-labs/flickimp) for every version tag.
#
#   Automatic: pushing a tag like v1.8.0 builds and pushes 1.8.0, 1.8 and latest
#              (tags with a suffix, e.g. v1.8.0-rc1, don't move "latest").
#   By hand:   gh workflow run docker.yml -f tag=v1.7.0
#              (for tags created before this workflow existed)
#
# Builds run on GitHub's machines; nothing is built locally.
name: Docker image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build, e.g. v1.7.0'
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/nutball-labs/flickimp

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Work out the tag and image tags
        id: v
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$TAG' is not a version tag like v1.7.0"; exit 1 ;;
          esac
          VERSION="${TAG#v}"
          BASE="${VERSION%%-*}"          # 1.7.0 from 1.7.0-rc1
          TAGS="$IMAGE:$VERSION"
          if [ "$BASE" = "$VERSION" ]; then
            TAGS="$TAGS,$IMAGE:${VERSION%.*},$IMAGE:latest"
          fi
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS"       >> "$GITHUB_OUTPUT"

      - name: Check out the tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.v.outputs.tag }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.v.outputs.tags }}
          labels: |
            org.opencontainers.image.title=FlickImp
            org.opencontainers.image.description=Self-hosted TV and movie watchlist tracker
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.licenses=GPL-3.0-or-later

